name: "SwiftUIListGridLargeData"
options:
  bundleIdPrefix: "com.huahuahu.demo"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  "SwiftUIListGridLargeData":
    type: application
    platform: iOS
    sources:
      - "SwiftUIListGridLargeData"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SwiftUIListGridLargeData"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - "SwiftUIListGridLargeDataTests"
  "SwiftUIListGridLargeDataTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - "SwiftUIListGridLargeDataTests"
    dependencies:
      - target: "SwiftUIListGridLargeData"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SwiftUIListGridLargeDataTests"
