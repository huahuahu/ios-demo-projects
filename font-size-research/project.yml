name: FontSizeResearch
options:
  bundleIdPrefix: com.tigerguo.demo
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  FontSizeResearch:
    type: application
    platform: iOS
    sources:
      - FontSizeResearch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tigerguo.demo.FontSizeResearch
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - FontSizeResearchTests
  FontSizeResearchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FontSizeResearchTests
    dependencies:
      - target: FontSizeResearch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tigerguo.demo.FontSizeResearchTests
