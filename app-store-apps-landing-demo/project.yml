name: "AppStoreAppsLandingDemo"
options:
  bundleIdPrefix: "com.huahuahu.demo"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
targets:
  "AppStoreAppsLandingDemo":
    type: application
    platform: iOS
    sources:
      - "AppStoreAppsLandingDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.AppStoreAppsLandingDemo"
        INFOPLIST_KEY_CFBundleDisplayName: "App 首页 Demo"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - "AppStoreAppsLandingDemoTests"
  "AppStoreAppsLandingDemoTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - "AppStoreAppsLandingDemoTests"
    dependencies:
      - target: "AppStoreAppsLandingDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.AppStoreAppsLandingDemoTests"
