name: LogResearchDemo
options:
  bundleIdPrefix: com.tigerguo.demo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  LogResearchDemo:
    type: application
    platform: iOS
    sources:
      - LogResearchDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tigerguo.demo.LogResearchDemo
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - LogResearchDemoTests
  LogResearchDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LogResearchDemoTests
    dependencies:
      - target: LogResearchDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tigerguo.demo.LogResearchDemoTests

