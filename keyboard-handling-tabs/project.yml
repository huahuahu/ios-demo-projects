name: "KeyboardHandlingTabs"
options:
  bundleIdPrefix: "com.huahuahu.demo"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  "KeyboardHandlingTabs":
    type: application
    platform: iOS
    sources:
      - "KeyboardHandlingTabs"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.KeyboardHandlingTabs"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - "KeyboardHandlingTabsTests"
  "KeyboardHandlingTabsTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - "KeyboardHandlingTabsTests"
    dependencies:
      - target: "KeyboardHandlingTabs"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.KeyboardHandlingTabsTests"
