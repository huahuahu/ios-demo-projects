<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
  <title id="title">SwiftUI navigation routing structure</title>
  <desc id="desc">A diagram showing Router owning tab paths and root presentations, while each PresentationNode owns its own path and child presentations.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d9e2f1; stroke-width: 2; filter: url(#shadow); }
      .node { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .node-alt { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .node-warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .muted { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
      .title { fill: #172033; font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #172033; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .text { fill: #53617a; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #53617a; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .edge { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
      .edge-muted { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 8; marker-end: url(#arrow-muted); }
      .divider { stroke: #d9e2f1; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="780" rx="28" />
  <text class="title" x="56" y="62">SwiftUI Navigation Handling 结构</text>
  <text class="text" x="56" y="92">Root Router 管全局导航；每个 PresentationNode 管自己的本地 stack 和下一层 modal。</text>

  <rect class="panel" x="56" y="126" width="420" height="250" rx="18" />
  <text class="label" x="86" y="166">Router</text>
  <text class="text" x="86" y="196">selectedTab</text>
  <text class="text" x="86" y="224">inboxPath: [Route]</text>
  <text class="text" x="86" y="252">settingsPath: [Route]</text>
  <line class="divider" x1="86" y1="276" x2="446" y2="276" />
  <text class="text" x="86" y="310">sheet: PresentationNode?</text>
  <text class="text" x="86" y="338">fullScreen: PresentationNode?</text>

  <rect class="node" x="590" y="128" width="220" height="86" rx="14" />
  <text class="label" x="620" y="162">Inbox Tab</text>
  <text class="tiny" x="620" y="188">NavigationStack(path: inboxPath)</text>

  <rect class="node" x="840" y="128" width="220" height="86" rx="14" />
  <text class="label" x="870" y="162">Settings Tab</text>
  <text class="tiny" x="870" y="188">NavigationStack(path: settingsPath)</text>

  <path class="edge" d="M476 212 C520 180 540 171 590 171" />
  <path class="edge" d="M476 248 C560 215 750 178 840 171" />

  <rect class="node-alt" x="590" y="292" width="260" height="128" rx="16" />
  <text class="label" x="620" y="328">Root Sheet Node</text>
  <text class="text" x="620" y="356">route: .sheet(.filters)</text>
  <text class="text" x="620" y="382">path: [Route]</text>
  <text class="tiny" x="620" y="406">sheet / fullScreen child</text>

  <rect class="node-warn" x="590" y="478" width="260" height="128" rx="16" />
  <text class="label" x="620" y="514">Child Sheet Node</text>
  <text class="text" x="620" y="542">route: .sheet(.composer)</text>
  <text class="text" x="620" y="568">path: [Route]</text>
  <text class="tiny" x="620" y="592">dismiss 只清 parent.sheet</text>

  <rect class="muted" x="590" y="664" width="260" height="72" rx="16" />
  <text class="label" x="620" y="698">Grandchild Cover</text>
  <text class="tiny" x="620" y="720">仍然是 PresentationNodeView</text>

  <path class="edge" d="M476 312 C520 325 540 350 590 356" />
  <path class="edge" d="M720 420 L720 478" />
  <path class="edge" d="M720 606 L720 664" />

  <rect class="panel" x="884" y="292" width="180" height="128" rx="16" />
  <text class="label" x="912" y="328">Deep Link</text>
  <text class="tiny" x="912" y="356">有 active modal</text>
  <text class="tiny" x="912" y="380">先 deferred</text>
  <text class="tiny" x="912" y="404">dismiss 后 apply</text>
  <path class="edge-muted" d="M884 356 C830 356 820 356 850 356" />

  <rect class="panel" x="884" y="478" width="180" height="128" rx="16" />
  <text class="label" x="916" y="514">两种 push</text>
  <text class="tiny" x="916" y="542">node.push:</text>
  <text class="tiny" x="916" y="564">本层 stack</text>
  <text class="tiny" x="916" y="590">router.push:</text>
  <text class="tiny" x="916" y="612">背后 tab stack</text>

  <path class="edge-muted" d="M850 542 C870 542 870 542 884 542" />

  <text class="tiny" x="56" y="724">关键规则：关闭 nested sheet 时只清父 node 的 sheet，所以会回到 Filter sheet，而不是回到 root。</text>
</svg>
