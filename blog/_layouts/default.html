<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta
      name="description"
      content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}"
    />
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  </head>
  <body>
    <main class="page {% if page.page_class %}{{ page.page_class }}{% endif %}">
      {{ content }}
    </main>
    <script type="module">
      const mermaidBlocks = document.querySelectorAll("code.language-mermaid");

      if (mermaidBlocks.length > 0) {
        const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs");

        mermaid.initialize({
          startOnLoad: false,
          theme: "base",
          themeVariables: {
            primaryColor: "#eff6ff",
            primaryBorderColor: "#bfdbfe",
            primaryTextColor: "#172033",
            lineColor: "#2563eb",
            textColor: "#172033",
            fontFamily: 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
          }
        });

        mermaidBlocks.forEach((block) => {
          const pre = block.closest("pre");
          const highlighter = block.closest(".highlighter-rouge");
          const container = document.createElement("div");
          container.className = "mermaid";
          container.textContent = block.textContent;
          (highlighter || pre).replaceWith(container);
        });

        await mermaid.run({ nodes: document.querySelectorAll(".mermaid") });
      }
    </script>
  </body>
</html>
