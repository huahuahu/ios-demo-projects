name: "ObservationViewInvalidationDemo"
options:
  bundleIdPrefix: "com.huahuahu.demo"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: ""
targets:
  "ObservationViewInvalidationDemo":
    type: application
    platform: iOS
    sources:
      - "ObservationViewInvalidationDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.ObservationViewInvalidationDemo"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - "ObservationViewInvalidationDemoTests"
  "ObservationViewInvalidationDemoTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - "ObservationViewInvalidationDemoTests"
    dependencies:
      - target: "ObservationViewInvalidationDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.ObservationViewInvalidationDemoTests"
