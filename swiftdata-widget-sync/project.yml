name: "SwiftDataResearch"
options:
  bundleIdPrefix: "com.huahuahu.demo"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  "SwiftDataResearch":
    type: application
    platform: iOS
    sources:
      - "SwiftDataResearch"
      - "SharedNotes"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SwiftDataResearch"
        CODE_SIGN_ENTITLEMENTS: "SwiftDataResearch/SwiftDataResearch.entitlements"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    dependencies:
      - target: "SwiftDataResearchWidget"
    scheme:
      testTargets:
        - "SwiftDataResearchTests"
  "SwiftDataResearchWidget":
    type: app-extension
    platform: iOS
    sources:
      - "SwiftDataResearchWidget"
      - "SharedNotes"
    info:
      path: "SwiftDataResearchWidget/Info.plist"
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SwiftDataResearch.Widget"
        CODE_SIGN_ENTITLEMENTS: "SwiftDataResearchWidget/SwiftDataResearchWidget.entitlements"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
  "SwiftDataResearchTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - "SwiftDataResearchTests"
    dependencies:
      - target: "SwiftDataResearch"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SwiftDataResearchTests"
