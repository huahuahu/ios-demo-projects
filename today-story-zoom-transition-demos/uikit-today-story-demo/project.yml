name: "UIKitTodayStoryDemo"
options:
  bundleIdPrefix: "com.huahuahu.demo"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: ""
targets:
  "UIKitTodayStoryDemo":
    type: application
    platform: iOS
    sources:
      - "UIKitTodayStoryDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.UIKitTodayStoryDemo"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - "UIKitTodayStoryDemoTests"
        - "UIKitTodayStoryDemoUITests"
  "UIKitTodayStoryDemoTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - "UIKitTodayStoryDemoTests"
    dependencies:
      - target: "UIKitTodayStoryDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.UIKitTodayStoryDemoTests"
  "UIKitTodayStoryDemoUITests":
    type: bundle.ui-testing
    platform: iOS
    sources:
      - "UIKitTodayStoryDemoUITests"
    dependencies:
      - target: "UIKitTodayStoryDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.UIKitTodayStoryDemoUITests"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
