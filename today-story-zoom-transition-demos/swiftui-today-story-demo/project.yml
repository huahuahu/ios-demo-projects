name: "SwiftUITodayStoryDemo"
options:
  bundleIdPrefix: "com.huahuahu.demo"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: ""
targets:
  "SwiftUITodayStoryDemo":
    type: application
    platform: iOS
    sources:
      - "SwiftUITodayStoryDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SwiftUITodayStoryDemo"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - "SwiftUITodayStoryDemoTests"
        - "SwiftUITodayStoryDemoUITests"
  "SwiftUITodayStoryDemoTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - "SwiftUITodayStoryDemoTests"
    dependencies:
      - target: "SwiftUITodayStoryDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SwiftUITodayStoryDemoTests"
  "SwiftUITodayStoryDemoUITests":
    type: bundle.ui-testing
    platform: iOS
    sources:
      - "SwiftUITodayStoryDemoUITests"
    dependencies:
      - target: "SwiftUITodayStoryDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SwiftUITodayStoryDemoUITests"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
