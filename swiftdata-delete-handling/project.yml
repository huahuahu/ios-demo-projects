name: "SwiftDataDeleteHandling"
options:
  bundleIdPrefix: "com.huahuahu.demo"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  "SwiftDataDeleteHandling":
    type: application
    platform: iOS
    sources:
      - "SwiftDataDeleteHandling"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SwiftDataDeleteHandling"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - "SwiftDataDeleteHandlingTests"
  "SwiftDataDeleteHandlingTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - "SwiftDataDeleteHandlingTests"
    dependencies:
      - target: "SwiftDataDeleteHandling"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SwiftDataDeleteHandlingTests"
