name: "SpatialAudioModePickerDemo"
options:
  bundleIdPrefix: "com.huahuahu.demo"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  "SpatialAudioModePickerDemo":
    type: application
    platform: iOS
    sources:
      - "SpatialAudioModePickerDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SpatialAudioModePickerDemo"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - "SpatialAudioModePickerDemoTests"
  "SpatialAudioModePickerDemoTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - "SpatialAudioModePickerDemoTests"
    dependencies:
      - target: "SpatialAudioModePickerDemo"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "com.huahuahu.demo.SpatialAudioModePickerDemoTests"
